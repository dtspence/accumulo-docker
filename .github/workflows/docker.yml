name: Docker

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Keep a publication's tested staging images and manifest updates together.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.config.outputs.versions }}
      image: ${{ steps.config.outputs.image }}
      publish: ${{ steps.config.outputs.publish }}
    steps:
      - id: config
        env:
          IMAGE_GROUP: ${{ vars.IMAGE_GROUP || github.repository_owner }}
          PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          {
            echo 'versions={"include":[{"accumulo_series":"2.1","accumulo_version":"2.1.6","zookeeper_version":"3.9.5","latest":true}]}'
            echo "image=ghcr.io/${IMAGE_GROUP,,}/accumulo"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Accumulo ${{ matrix.version.accumulo_version }} / ${{ matrix.platform.arch }}
    needs: prepare
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.versions).include }}
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      VERSION: ${{ matrix.version.accumulo_version }}
      ARCH: ${{ matrix.platform.arch }}
      PUBLISH: ${{ needs.prepare.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - uses: docker/setup-buildx-action@v4
      - name: Set staging tag
        id: staging
        run: echo "tag=$IMAGE:$VERSION-sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH" >> "$GITHUB_OUTPUT"
      - name: Build final image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.platform.arch }}
          load: true
          tags: ${{ steps.staging.outputs.tag }}
          build-args: |
            ACCUMULO_VERSION=${{ matrix.version.accumulo_version }}
            ZOOKEEPER_VERSION=${{ matrix.version.zookeeper_version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=accumulo-${{ matrix.version.accumulo_version }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=accumulo-${{ matrix.version.accumulo_version }}-${{ matrix.platform.arch }}
      - name: Test final image
        run: tests/smoke.sh '${{ steps.staging.outputs.tag }}' "$ARCH" "$VERSION"
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image and record digest
        if: env.PUBLISH == 'true'
        env:
          STAGING_TAG: ${{ steps.staging.outputs.tag }}
        run: |
          docker push "$STAGING_TAG"
          mkdir -p digests
          docker image inspect "$STAGING_TAG" --format '{{json .RepoDigests}}' |
            jq -er --arg image "$IMAGE" '.[] | select(startswith($image + "@sha256:"))' > "digests/$ARCH"
      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: digests-${{ matrix.version.accumulo_version }}-${{ matrix.platform.arch }}
          path: digests/*
          retention-days: 1

  merge:
    name: Publish Accumulo ${{ matrix.accumulo_version }} manifest
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.versions) }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      VERSION: ${{ matrix.accumulo_version }}
      SERIES: ${{ matrix.accumulo_series }}
      IS_LATEST: ${{ matrix.latest }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.accumulo_version }}-*
          path: digests
          merge-multiple: true
      - name: Publish and verify shared tags
        shell: bash
        run: |
          set -euo pipefail
          tags=("$IMAGE:$VERSION-sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=("$IMAGE:$VERSION-$GITHUB_REF_NAME")
          else
            tags+=("$IMAGE:$SERIES" "$IMAGE:$VERSION")
            if [[ "$IS_LATEST" == true ]]; then tags+=("$IMAGE:latest"); fi
          fi
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          docker buildx imagetools create "${args[@]}" "$(cat digests/amd64)" "$(cat digests/arm64)"
          for tag in "${tags[@]}"; do
            docker buildx imagetools inspect --raw "$tag" | jq -e '
              [.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]'
          done
