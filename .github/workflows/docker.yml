name: Docker

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Accumulo ${{ matrix.accumulo_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - accumulo_series: '2.1'
            accumulo_version: '2.1.6'
            zookeeper_version: '3.9.5'
            latest: true
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v6

      - name: Set image name and tags
        id: image
        env:
          IMAGE_GROUP: ${{ vars.IMAGE_GROUP || github.repository_owner }}
          ACCUMULO_SERIES: ${{ matrix.accumulo_series }}
          ACCUMULO_VERSION: ${{ matrix.accumulo_version }}
          IS_LATEST: ${{ matrix.latest }}
        shell: bash
        run: |
          image="ghcr.io/${IMAGE_GROUP,,}/accumulo"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "$image:$ACCUMULO_VERSION-sha-$GITHUB_SHA"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "$image:$ACCUMULO_VERSION-${GITHUB_REF_NAME}"
            elif [[ "$PUBLISH" == true ]]; then
              echo "$image:$ACCUMULO_SERIES"
              echo "$image:$ACCUMULO_VERSION"
              if [[ "$IS_LATEST" == true ]]; then
                echo "$image:latest"
              fi
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            ACCUMULO_VERSION=${{ matrix.accumulo_version }}
            ZOOKEEPER_VERSION=${{ matrix.zookeeper_version }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=accumulo-${{ matrix.accumulo_version }}
          cache-to: type=gha,mode=max,scope=accumulo-${{ matrix.accumulo_version }}
